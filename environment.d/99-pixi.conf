# Pixi (https://pixi.sh), installed to ~/.pixi/bin, for the graphical session
# and every process it starts. Named 99- to come after Ubuntu's
# /usr/lib/environment.d/99-environment.conf, which resets PATH. SSH logins do
# not read environment.d, so .bash_profile adds the same directory. Unlike
# .bash_profile, this cannot test that ~/.pixi/bin exists; a PATH entry that
# does not exist is skipped. setup.sh does not install Pixi: each project's
# README installs the version it pins.
PATH=${HOME}/.pixi/bin:${PATH}
